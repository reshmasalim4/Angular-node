<main class="home">
  <header>
    <h1>Angular + Node</h1>
    <button type="button" (click)="logout()">Log out</button>
  </header>

  @if (user(); as user) {
    <section class="profile">
      @if (user.picture) {
        <img [src]="user.picture" alt="" width="64" height="64" referrerpolicy="no-referrer" />
      }
      <div>
        <h2>{{ user.name || user.email }}</h2>
        <p>{{ user.email }}</p>
      </div>
    </section>
  }

  <p>{{ message() }}</p>
</main>
